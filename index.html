let lang = 'ko';

function setLang(l) {
    lang = l;
    const labels = { ko:'KO', zh:'中文', en:'EN' };
    document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.trim() === labels[l]);
    });
    const t = I18N[l];
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (t[k] !== undefined) el.textContent = t[k];
    });
    document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
    if (menuData.length) renderMenu(menuData);
}

/* ================================================
   CSV 파싱 — ₩85,000 쉼표 포함 가격 올바르게 처리
   ================================================ */
function parseCSV(text) {
    const rows = text.trim().split('\n').slice(1);
    return rows.map(row => {
        const cols = [];
        let cur = '', inQ = false;
        for (let i = 0; i < row.length; i++) {
            const c = row[i];
            if (c === '"') { inQ = !inQ; }
            else if (c === ',' && !inQ) { cols.push(cur); cur = ''; }
            else { cur += c; }
        }
        cols.push(cur);
        const name  = (cols[0] || '').trim();
        const price = parseInt((cols[1] || '').replace(/[^0-9]/g, '')) || 0;
        const best  = (cols[2] || '').trim().toUpperCase() === 'Y';
        return { name, price, best };
    }).filter(m => m.name);
}

function renderMenu(data) {
    const t     = I18N[lang];
    const table = document.getElementById('menu-table');
    table.innerHTML = data.map(item => {
        let primary = item.name, secondary = '';
        if (lang !== 'ko' && TR[item.name]) {
            primary   = TR[item.name][lang] || item.name;
            secondary = item.name;
        }
        const priceStr = item.price.toLocaleString('ko-KR') + '원';
        // 한글+괄호 파일명 인코딩 — 괄호는 그대로 유지
        const encoded = encodeURIComponent(item.name)
            .replace(/%28/g, '(').replace(/%29/g, ')');
        const imgSrc = 'imeges/' + encoded + '.jpg';
        const bestMark = item.best ? '<span class="best-dot"></span>' : '';
        return `<tr>
  <td class="menu-td-img"><img src="${imgSrc}" alt="${primary}" onerror="imgFail(this)"></td>
  <td class="menu-td-name">
    <div class="menu-name-ko">${bestMark}${primary}</div>
    ${secondary ? '<div class="menu-name-tr">' + secondary + '</div>' : ''}
  </td>
  <td class="menu-td-price">${priceStr}</td>
</tr>`;
    }).join('');
}

function imgFail(el) {
    const ph = document.createElement('div');
    ph.className = 'no-img';
    ph.textContent = '—';
    el.parentNode.replaceChild(ph, el);
}

function sharePage() {
    const d = { title:'돈나무 | 제주 숙성 흑돼지', text:'제주공항 8분 · 100% 제주산 숙성 흑돼지 전문점', url:window.location.href };
    if (navigator.share) { navigator.share(d).catch(()=>{}); }
    else { navigator.clipboard.writeText(d.url).then(()=>alert('링크가 복사됐어요!')); }
}

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }

async function loadMenu() {
    try {
        const res = await fetch(CSV_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const parsed = parseCSV(await res.text());
        menuData = parsed.length ? parsed : FALLBACK;
    } catch(e) {
        console.warn('CSV 실패 → 폴백:', e.message);
        menuData = FALLBACK;
    }
    renderMenu(menuData);
}

document.addEventListener('DOMContentLoaded', () => { loadMenu(); setLang('ko'); });
</script>
</body>
