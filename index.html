<head>

    <style>
        /* ================================================
           CSS 변수 — 색상 변경은 여기서만
           ================================================ */
        :root {
            --bg:     #faf7f2;
            --bg2:    #f0e9dc;
            --dark:   #1a0e05;
            --gold:   #A0733A;
            --text:   #2a1f12;
            --muted:  #7a6a55;
            --border: rgba(160,115,58,0.18);
            --serif:  'Playfair Display', serif;
            --sans:   'Noto Sans KR', 'Noto Sans SC', sans-serif;
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { background:var(--bg); color:var(--text); font-family:var(--sans); font-weight:300; }

        /* ================================================
           상단 바
           ================================================ */
        nav {
            position:fixed; top:0; width:100%; z-index:100;
            padding:14px 28px;
            display:flex; justify-content:space-between; align-items:center;
            background:rgba(250,247,242,.96);
            border-bottom:1px solid var(--border);
            backdrop-filter:blur(8px);
        }
        .nav-logo {
            font-family:var(--serif); font-size:1.4rem;
            color:var(--gold); letter-spacing:.1em; text-decoration:none;
        }
        .nav-right { display:flex; align-items:center; gap:8px; }
        .lang-btn, .share-btn {
            background:none; border:1px solid var(--border); color:var(--muted);
            padding:5px 12px; font-size:.7rem; cursor:pointer; letter-spacing:.08em;
            font-family:var(--sans); transition:all .25s;
        }
        .lang-btn.active, .lang-btn:hover,
        .share-btn:hover { border-color:var(--gold); color:var(--gold); }

        /* ================================================
           히어로
           ================================================ */
        #hero {
            height:100vh; position:relative;
            display:flex; align-items:center; justify-content:center;
        }
        .hero-bg {
            position:absolute; inset:0;
            background:url('imeges/hero.png') center/cover no-repeat;
            filter:brightness(.55);
        }
        .hero-overlay {
            position:absolute; inset:0;
            background:linear-gradient(to bottom, transparent 50%, var(--bg) 100%);
        }
        .hero-content { position:relative; z-index:1; text-align:center; color:#fff; }
        .hero-tag {
            font-size:.65rem; letter-spacing:.4em; color:rgba(255,255,255,.7);
            text-transform:uppercase; margin-bottom:16px;
            opacity:0; animation:up .8s .3s forwards;
        }
        .hero-name {
            font-family:var(--serif); font-size:clamp(4rem,12vw,9rem);
            font-weight:700; letter-spacing:.15em; line-height:1;
            opacity:0; animation:up .8s .5s forwards;
        }
        .hero-sub {
            margin-top:20px; font-size:.72rem; letter-spacing:.3em;
            color:rgba(255,255,255,.55); text-transform:uppercase;
            opacity:0; animation:up .8s .7s forwards;
        }

        /* ================================================
           메뉴 섹션
           ================================================ */
        #menu { padding:70px 28px 60px; max-width:960px; margin:0 auto; }
        .section-title {
            font-family:var(--serif); font-size:1.6rem; color:var(--text);
            margin-bottom:6px;
        }
        .section-line { width:40px; height:1px; background:var(--gold); margin:12px 0 32px; }

        .menu-table { width:100%; border-collapse:collapse; }
        .menu-table tr { border-bottom:1px solid var(--border); }
        .menu-table tr:last-child { border-bottom:none; }
        .menu-td-img { width:72px; padding:10px 12px 10px 0; }
        .menu-td-img img {
            width:64px; height:64px; object-fit:cover; display:block; border-radius:2px;
        }
        .no-img {
            width:64px; height:64px; background:var(--bg2);
            display:flex; align-items:center; justify-content:center;
            color:var(--muted); font-size:.7rem; border-radius:2px;
        }
        .menu-td-name { padding:10px 8px; vertical-align:middle; }
        .menu-name-ko { font-size:.9rem; font-weight:500; color:var(--text); }
        .menu-name-tr { font-size:.75rem; color:var(--muted); margin-top:2px; }
        .menu-td-price {
            padding:10px 0 10px 8px; text-align:right; vertical-align:middle;
            font-family:var(--serif); font-size:.95rem; color:var(--gold); white-space:nowrap;
        }
        .best-dot {
            display:inline-block; width:6px; height:6px;
            background:var(--gold); border-radius:50%;
            margin-right:6px; vertical-align:middle;
        }
        .menu-loading { padding:48px 0; text-align:center; color:var(--muted); font-size:.82rem; }

        /* ================================================
           하단 정보 섹션
           ================================================ */
        #info {
            background:var(--dark); color:rgba(255,255,255,.85);
            padding:60px 28px 0;
        }
        .info-inner { max-width:960px; margin:0 auto; }

        .interior-imgs {
            display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:40px;
        }
        .interior-imgs img { width:100%; height:200px; object-fit:cover; opacity:.85; }

        .map-frame {
            width:100%; height:300px; border:none;
            filter:grayscale(.2); margin-bottom:40px;
        }

        .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:40px; padding-bottom:48px; }
        .info-block h3 {
            font-size:.62rem; letter-spacing:.35em;
            color:var(--gold); text-transform:uppercase; margin-bottom:16px;
        }
        .info-block p {
            font-size:.82rem; color:rgba(255,255,255,.6); line-height:2;
        }

        .contact-btns { display:flex; flex-direction:column; gap:10px; }
        .c-btn {
            display:flex; align-items:center; gap:10px;
            padding:12px 18px; border:1px solid rgba(255,255,255,.12);
            color:rgba(255,255,255,.7); text-decoration:none;
            font-size:.8rem; font-family:var(--sans); transition:all .25s;
            background:none; cursor:pointer; width:100%; text-align:left;
        }
        .c-btn:hover { border-color:var(--gold); color:var(--gold); }
        .c-btn.disabled { opacity:.25; pointer-events:none; }

        footer {
            text-align:center; padding:20px;
            border-top:1px solid rgba(255,255,255,.06);
            color:rgba(255,255,255,.2); font-size:.65rem; letter-spacing:.1em;
        }

        /* ================================================
           애니메이션
           ================================================ */
        @keyframes up {
            from { opacity:0; transform:translateY(14px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ================================================
           모바일
           ================================================ */
        @media (max-width:640px) {
            nav { padding:12px 16px; }
            #menu { padding:50px 16px 40px; }
            .info-grid { grid-template-columns:1fr; gap:28px; }
            #info { padding:40px 16px 0; }
            .interior-imgs img { height:130px; }
        }
    </style>
</head>
